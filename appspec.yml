version: 0.0
os: linux
files:
  - source: /
    destination: /home/ubuntu/gooroomi/
    overwrite: yes
file_exists_behavior: OVERWRITE

permissions:
  - object: /home/ubuntu/gooroomi
    pattern: "**"
    owner: ubuntu
    group: ubuntu

hooks:
    BeforeInstall:
      - location: script/init-deploy.sh
        timeout: 300
        runas: root
    ApplicationStart:
      - location: script/deploy.sh
        timeout: 300
        runas: root
