spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_HOST}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

logging:
  file:
    path: ./gooroomi-dev-logs

openapi:
  bus:
    key: ${OPEN_API_KEY}

elk:
  elasticsearch:
    host: elasticsearch
  logstash:
    host: logstash
  kibana:
    host: kibana