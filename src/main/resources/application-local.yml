spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/gooroomi
    username: ${LOCAL_DB_USERNAME}
    password: ${LOCAL_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

logging:
  file:
    path: ./gooroomi-local-logs

openapi:
  bus:
    key: ${OPEN_API_KEY}

bus:
  station:
    search-radius: 300

management:
  endpoint:
    health:
      show-details: always